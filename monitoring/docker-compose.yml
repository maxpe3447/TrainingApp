# Local monitoring stack for TrainingApp.Api. The app runs on the host (dotnet run):
# it pushes logs to otel-collector, Prometheus pulls metrics from it.
#   docker compose -f monitoring/docker-compose.yml up -d
#   Grafana: http://localhost:3000
name: trainingapp-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: trainingapp-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # The app runs on the host, not in Docker; this makes host.docker.internal resolvable on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    container_name: trainingapp-loki
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      # HTTP API; otel-collector pushes logs to the native OTLP endpoint /otlp/v1/logs.
      - "3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    container_name: trainingapp-otel-collector
    command:
      - --config=/etc/otelcol/otel-collector.yml
    depends_on:
      - loki
    ports:
      # The app's single OTLP endpoint: logs go on to Loki.
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./otel-collector/otel-collector.yml:/etc/otelcol/otel-collector.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    container_name: trainingapp-grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      # Local development only: open Grafana without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/logs.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
