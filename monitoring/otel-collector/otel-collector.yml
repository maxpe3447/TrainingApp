# Single OTLP entry point for the app: it pushes every signal to one endpoint,
# and the collector routes each signal to its backend. For now: logs to Loki.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch: {}

exporters:
  # Loki's native OTLP endpoint; the exporter appends /v1/logs.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
