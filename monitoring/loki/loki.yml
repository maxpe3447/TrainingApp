# Single-process Loki with filesystem storage: local development only.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP log attributes (severity, template arguments, later trace_id) are stored as structured metadata;
  # they can be filtered on without being labels (step 04 uses trace_id to link logs to traces).
  allow_structured_metadata: true
  volume_enabled: true
  # Loki adds detected_level from the OTLP severity, used by the dashboards' level filter.
  discover_log_levels: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
